<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image render</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        color: #f5f5f5;
        background: radial-gradient(ellipse 90% 70% at 12% 8%, #0f2744 0%, #070f1a 55%, #070f1a 100%);
        background-color: #070f1a;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
      }

      .brand-mark {
        width: 88px;
        height: 88px;
        display: block;
        object-fit: contain;
        filter: brightness(0) saturate(100%) invert(78%) sepia(58%) saturate(480%) hue-rotate(2deg)
          brightness(104%) contrast(91%) drop-shadow(0 0 3px rgba(212, 175, 55, 0.95))
          drop-shadow(0 0 10px rgba(201, 162, 39, 0.55)) drop-shadow(0 0 20px rgba(201, 162, 39, 0.3));
      }

      .title {
        margin-top: 40px;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 58px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .rule {
        margin-top: 22px;
        width: 220px;
        height: 2px;
        background: linear-gradient(90deg, #d4af37, #c9a227);
        border-radius: 1px;
      }

      .subtitle {
        margin-top: 28px;
        max-width: 620px;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.35;
        color: rgba(245, 245, 245, 0.92);
      }

      .tagline {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c9a227;
      }

      .curves {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .curves path {
        fill: none;
        stroke: rgba(201, 162, 39, 0.45);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg class="curves" viewBox="0 0 1200 630" aria-hidden="true">
        <path d="M -20 520 Q 420 470, 820 500 T 1280 470" />
        <path d="M -20 560 Q 380 510, 760 540 T 1240 510" />
      </svg>
      <!-- Same asset as Header.tsx /airplane.svg -->
      <img
        class="brand-mark"
        src="../public/airplane.svg"
        width="88"
        height="88"
        alt=""
      />
      <h1 class="title">Flogaus Aviation</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="subtitle">Flight instruction in the Wilmington, DE area</p>
      <p class="tagline">Train with clarity. Fly with confidence.</p>
    </div>
    <script>
      document.fonts.ready.then(() => {
        document.body.dataset.ready = "1";
      });
    </script>
  </body>
</html>
